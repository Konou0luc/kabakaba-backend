name: Unclaimed orders (signalement des commandes non récupérées)

# Signale les commandes restées « Prêtes » au-delà du délai paramétrable (CDC 30) : appelle
# l'endpoint interne protégé par CRON_SECRET, comme cron-heartbeat.yml. Mesure uniquement :
# aucun changement de statut, aucune notification, aucun remboursement.
# La planification GitHub Actions peut être retardée de quelques minutes.

on:
  schedule:
    # Toutes les 15 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  unclaimed-orders:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /internal/cron/unclaimed-orders
        run: |
          curl -fsS --max-time 30 \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://kabakaba-backend.vercel.app/api/v1/internal/cron/unclaimed-orders
